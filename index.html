<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal RP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container fade-in">
    <h1>Welcome to Universal RP</h1>
    <p>Join our GTA V Roleplay community and experience immersive RP like never before.</p>

    <div class="status-box">
      <strong>Server Status:</strong> <span class="status online">Online</span>
    </div>

    <div class="buttons">
      <a href="https://discord.gg/" target="_blank" class="btn">Join Discord</a>
      <a href="apply.html" class="btn">Apply for Whitelist</a>
      <a href="rules.html" class="btn">Server Rules</a>
    </div>

    <div class="discord-widget">
      <iframe src="https://discord.com/widget?id=1366813871746060399&theme=dark"
        width="100%" height="300" allowtransparency="true" frameborder="0"
        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
      </iframe>
    </div>
  </div>
</body>
</html>
